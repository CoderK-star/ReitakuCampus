<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>ReitakuCampus</title>
    <link rel="preload" as="image" href="image/main1.jpg" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Shippori+Mincho:wght@400;500&family=BIZ+UDPGothic&display=swap" rel="stylesheet">
    <script src="page.js" defer></script>
</head>
<body>
    <header>
        <div id="brand" class="logo"></div>
    </header>

    <div class="hero" id="hero-slider">
        <div class="hero-txt">
            <h1 id="hero-title" class="h-title"></h1>
            <span id="hero-sub" class="h-sub"></span>
        </div>
    </div>

    <div class="content">
        <div class="concept-box">
            <div id="concept-text" class="fade-in"></div>
        </div>

        <div class="rooms-header fade-in">
            <h2>Gallery</h2>
            <button id="slider-toggle" class="slide-toggle-btn">AUTO PLAY: OFF</button>
        </div>

        <div class="slider-wrapper">
            <div id="arrow-left" class="slider-arrow slider-arrow-left">‹</div>
            <section id="rooms" class="room-sec">
            </section>
            <div id="arrow-right" class="slider-arrow slider-arrow-right">›</div>
        </div>

        <section id="map-section" class="fade-in" style="margin-top: 8rem; margin-bottom: 5rem;">
            <h2 style="font-family: 'Cinzel', serif; font-size: 2rem; margin-bottom: 2rem; letter-spacing: 0.1em;">Campus Map</h2>
            <div style="width: 100%; height: 500px; border: 1px solid #000; position: relative;">
                <iframe src="./Map/index.html" style="width: 100%; height: 100%; border: none; display: block;"></iframe>
            </div>
        </section>
    </div>

    <div class="business-overview">
        <div class="bo-title">Reitaku University</div>
        <div class="bo-info">
            <p>千葉県柏市光ケ丘２丁目１−１</p>
            <p><a href="https://www.reitaku-u.ac.jp/" class="bo-mail" target="_blank">www.reitaku-u.ac.jp</a></p>
            <button class="creator-btn" onclick="openCreatorModal()">CREDITS</button>
        </div>
    </div>


    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()">×</div>
            <img id="modal-img" src="" class="modal-img" onclick="closeModal()" style="cursor: pointer;">
            <div class="modal-body">
                <h2 id="modal-title" class="modal-title"></h2>
                <p id="modal-desc" class="modal-desc"></p>
                <a href="https://coderk-star.github.io/ReitakuMap/" target="_blank" class="btn" style="margin-top: 2rem; border: 1px solid #000; padding: 0.5rem 2rem;">詳細はこちら</a>
            </div>
        </div>
    </div>

    <!-- Creator Modal -->
    <div id="creator-modal" class="modal-overlay">
        <div class="modal-content creator-content">
            <div class="modal-close" onclick="closeCreatorModal()">×</div>
            <div class="modal-body">
                <div class="creator-info">
                    <p class="creator-title">制作・構成</p>
                    <p class="creator-group">河野洋ゼミ</p>
                    <p class="creator-name">グエン トアンキエト</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Overlay (Iframe) -->
    <div id="map-overlay" style="position: fixed; inset: 0; z-index: 3000; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s;">
        <iframe id="map-frame" style="width: 100%; height: 100%; border: none;" allow="fullscreen"></iframe>
    </div>

    <div class="book-bar">
        <span class="bb-text">Reitaku</span>
        <div class="bb-box">University</div>
    </div>
    <div class="footer">
        <p>&copy; 制作　河野洋ゼミ　グエントアンキエト</p>
    </div>
</body>
</html>
