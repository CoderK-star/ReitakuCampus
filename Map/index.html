<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/Reitaku.jpg">
    <title>Reitaku University Map</title>
    
    <!-- Preconnect to external CDNs for faster resource loading -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script defer src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>
    <!-- Pannellum for 360° street view -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script defer src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="map_css/map.css">
    
    <!-- API Keys (not tracked by git) -->
    <script src="js/config.js"></script>

    <!-- Google tag (gtag.js) - loaded dynamically from config -->
    <script>
        if (window.API_KEYS && window.API_KEYS.GTAG_ID) {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.API_KEYS.GTAG_ID;
            document.head.appendChild(s);
        }
    </script>
    <script defer src="js/gtag.js"></script>
</head>
<body>
    <!-- loading Animation -->
     <div id="loading" class="loading">
            <p class="loading-text">Loading...</p>
        <div class="spinner-part"></div>
        <div class="spinner-part"></div>
        <div class="spinner-part"></div>
     </div>
    
    <!-- Map Container -->
    <div id="map"></div>
    <button id="minimap-expand-btn" type="button" aria-pressed="false" aria-label="ミニマップを拡大">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 5H5v3" />
            <path d="M16 5h3v3" />
            <path d="M5 16v3h3" />
            <path d="M19 16v3h-3" />
        </svg>
    </button>

    <!-- Error Banner -->
    <div id="error-banner"></div>

    <!-- Side Panel (disabled in 2D map; kept only for backward compatibility) -->
    <div id="side-panel" style="display:none">
        <div id="panel-drag-handle"></div>
        <div id="panel-content"></div>
    </div>

    <!-- Street view overlay -->
    <div id="street-viewer" aria-hidden="true">
        <button id="streetview-exit-site-btn" type="button" aria-label="サイトに戻る" title="サイトに戻る" onclick="goBackToSite()">×</button>
        <div id="streetview-minimap-wrap" aria-hidden="true">
            <button id="streetview-minimap-toggle" type="button" aria-label="地図の表示切り替え" onclick="toggleMinimap()"></button>
            <img id="streetview-minimap" src="images/minimap/asunaro.png" alt="Minimap">
            <div id="streetview-minimap-markers"></div>
        </div>
        <div id="street-viewer-canvas"></div>
        <button id="streetview-nav-prev" class="streetview-nav-btn" type="button" aria-label="前のスポット">&lsaquo;</button>
        <button id="streetview-nav-next" class="streetview-nav-btn" type="button" aria-label="次のスポット">&rsaquo;</button>
        <div id="streetview-info-panel">
            <div id="streetview-drag-handle" aria-hidden="true"></div>
            <div class="streetview-panel-header">
                <div class="streetview-panel-controls" role="group" aria-label="360°コントロール">
                    <button id="streetview-fullscreen-btn" class="streetview-panel-btn" type="button" aria-pressed="false" aria-label="全画面表示">全画面表示</button>
                    <button id="streetview-autorotate-btn" class="streetview-panel-btn" type="button" aria-pressed="false" aria-label="自動回転モード">自動回転モード</button>
                    <button id="streetview-panel-toggle" class="streetview-panel-btn" type="button" aria-expanded="true" aria-label="画像を隠す">画像を隠す</button>
                    <button id="streetview-zoom-in" class="streetview-zoom-btn" type="button" aria-label="ズームイン">+</button>
                    <button id="streetview-zoom-out" class="streetview-zoom-btn" type="button" aria-label="ズームアウト">-</button>
                </div>
            </div>
            <div class="streetview-info-content">
                    <div>
                        <span id="streetview-current-category" class="streetview-chip"></span>
                        <h3 id="streetview-current-title">360°ビュー</h3>
                        <p id="streetview-current-meta"></p>
                    </div>
                    <div class="streetview-info-actions">
                    </div>
                </div>
                <div class="streetview-info-secondary">
                    <div class="streetview-carousel-shell">
                        <button id="streetview-carousel-prev" class="streetview-carousel-arrow" type="button" aria-label="前へ">&#10094;</button>
                        <div id="streetview-location-carousel"></div>
                        <button id="streetview-carousel-next" class="streetview-carousel-arrow" type="button" aria-label="次へ">&#10095;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="streetview-anchor-btn" type="button" aria-pressed="false" aria-label="360°ビューを切り替え" title="360°ビューを切り替え">
        <span class="streetview-anchor-label" aria-hidden="true">360°ビュー</span>
    </button>

    <!-- Load scripts (deferred) -->
    <script defer src="js/map.js"></script>
    <script defer src="js/getdata.js"></script>
</body>
</html>
